# Default thresholds. Domain pack thresholds override these.
# CLI --threshold flag overrides all.
thresholds:
  approve: 0.85
  human_review_min: 0.70   # scores in [0.70, 0.85) -> human_review
  revise_max: 0.70          # scores below this -> revise

# Decision priority when multiple checks fire (highest = wins)
decision_priority:
  - reject
  - revise
  - human_review
  - approve
