[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdictai-gate"
version = "0.1.0"
description = "Verdict AI: a test case gate. Rates AI-generated test cases and returns approve, revise, reject or human review."
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "typer>=0.12", "pyyaml>=6", "pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
verdict-ai = "verdict_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verdict_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
