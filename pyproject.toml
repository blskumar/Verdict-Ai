[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdictai-gate"
version = "0.1.0"
description = "Verdict AI: a test case gate. Rates AI-generated test cases and returns approve, revise, reject or human review."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "pyyaml>=6",
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.40"]

[project.scripts]
verdict-ai = "verdict_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verdict_ai = ["py.typed", "web/static/*", "*.yaml", "domains/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
