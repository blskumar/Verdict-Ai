name: Homeowners and Property
id_prefixes: [HOME]
context: >
  Homeowners covers a dwelling and related property. Rules cover year built and roof year ranges,
  supported states, occupancy, property age limits and protection class. Coverage limits and
  deductibles come from configured option lists.
glossary:
  dwelling limit: The coverage amount for the building itself.
  protection class: A fire-protection rating of the property location.
  occupancy: How the property is used, such as owner-occupied.
risk_tags: [property_age, protection_class, limits]
boundary_hints:
  - Year built just below and at the configured minimum.
  - Property age exactly at the maximum eligible age (is it inclusive?).
  - A deductible just above the configured maximum.
