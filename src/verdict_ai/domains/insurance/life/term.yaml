name: Term Life
id_prefixes: [TERM]
context: >
  Term life covers a fixed number of years. Product options define the allowed term lengths.
  Premium comes from the approved rate table in effect on the policy start date. Issue needs
  approval, acceptance and confirmed initial payment. The free-look period is configured
  (30 days in the sample pack).
glossary:
  term length: Number of years the cover lasts.
  smoker class: Rate class based on tobacco use.
  rate table: Approved premium rates by age, class, amount and term.
risk_tags: [rate_table_version, free_look, beneficiary_total]
boundary_hints:
  - A term length not in the product options.
  - Policy start on the effective date of a new rate table.
  - Free-look cancellation on day 30 versus day 31.
