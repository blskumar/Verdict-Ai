name: Common Application, Underwriting and Servicing
id_prefixes: [LIFE]
context: >
  Steps shared by all life products: creating and tracking applications, collecting disclosures
  and evidence, recording underwriting decisions, generating policy documents with an audit
  trail, changing beneficiaries and registering death claim notices.
glossary:
  referral: Case sent to manual review; it blocks issue until resolved.
  pending evidence: Status while required medical or other evidence is outstanding.
  death claim notice: A report of death; it records details and does not approve a claim.
risk_tags: [status_transitions, unauthorised_change, claim_notice, audit]
boundary_hints:
  - Death notice dated before the policy effective date.
  - Beneficiary totals at 95% and 100%.
  - Unknown application reference must not leak another applicant's data.
