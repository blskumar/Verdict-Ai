name: Life Insurance
description: Life insurance products and the shared application, underwriting and servicing steps.
context: >
  Life policies are underwritten before issue. A case can be approved, declined or referred, and
  a referral blocks issue until a human resolves it. Beneficiary allocations must total exactly
  100%. A claim notice records an event and never implies approval.
glossary:
  face amount: The death benefit amount.
  free-look period: A window after issue when the owner can cancel for a refund.
  beneficiary allocation: The percentage of the benefit each beneficiary receives.
  underwriting class: The risk category that drives the rate.
risk_tags: [underwriting, beneficiary_total, issue_gating, audit]
boundary_hints:
  - Allocations at 99.99%, 100% and 100.01%.
  - Last day of the free-look period.
  - Minimum and maximum issue age, and one day either side.
thresholds:
  similarity: 0.85
obsolete_terms:
  2001 cso: Replaced by the 2017 CSO mortality table for policies issued from 1 January 2020.
  1980 cso: Replaced by the 2017 CSO mortality table for policies issued from 1 January 2020.
  2001 vbt: Replaced by the 2015 VBT valuation basic table.
