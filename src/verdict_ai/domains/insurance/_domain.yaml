name: Insurance
description: Insurance products, from application and underwriting to rating, issue, servicing and claims.
context: >
  Insurance software handles applications, eligibility rules, premium rating, policy issue,
  mid-term changes and claim notices. Rules are driven by configured tables (rate tables,
  supported states, limits and deductible options) that the requirement text refers to but
  often does not list. Every transaction should leave an audit trail.
glossary:
  premium: The price charged for coverage for a period.
  underwriting: Risk assessment that ends in approve, decline or refer.
  referral: A case sent to a human underwriter instead of being decided automatically.
  endorsement: A mid-term change to a policy.
  audit trail: The recorded actor, timestamp and changed fields for a transaction.
risk_tags: [money, regulatory, eligibility, audit]
boundary_hints:
  - Check both sides of every configured limit, age, date and amount.
  - A requirement that says "configured" needs the actual value in the test or a named config reference.
vague_terms: [appropriate, as applicable, as needed, reasonable, properly, correctly, works, etc, and so on]
ambiguous_phrases: ["blocked or referred", "or as configured", "as per rules"]
thresholds:
  revise_below: 0.70
  human_review_band: [0.70, 0.85]
  similarity: 0.85
