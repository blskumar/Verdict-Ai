name: Savings Accounts
id_prefixes: [SAV]
context: >
  Interest-bearing consumer deposit accounts. Calculate daily compounded interest paid monthly.
  Subject to excessive withdrawal monitoring and tiered Annual Percentage Yield (APY) balance tiers.
glossary:
  apy: Annual Percentage Yield reflecting compound interest.
  accrual: Daily calculation of interest earned but not yet paid.
risk_tags: [interest_accrual, apy_tiers, withdrawal_limit]
boundary_hints:
  - Balance reaching the boundary between APY tiers (e.g., 10,000 dollars threshold).
  - Monthly withdrawal count on threshold limits.
obsolete_terms:
  six withdrawals per month: The Federal Reserve removed the Regulation D six-transfer limit in April 2020. A bank may still set its own limit; require the configured value.
  6 withdrawals per month: The Federal Reserve removed the Regulation D six-transfer limit in April 2020. A bank may still set its own limit; require the configured value.
  passbook: Legacy paper product. Test against the current digital account and statement.
