name: Checking Accounts
id_prefixes: [CHK]
context: >
  Demand deposit accounts allowing unlimited deposits and withdrawals. Require minimum opening deposit,
  overdraft option enrollment, monthly maintenance fee waiver qualifications (e.g., minimum balance or direct deposit).
glossary:
  maintenance fee: Monthly fee assessed if waiver criteria are not satisfied.
  nsf: Non-Sufficient Funds status when an item is returned unpaid.
risk_tags: [overdraft_fee, waiver_criteria, min_deposit]
boundary_hints:
  - Opening balance exactly equal to minimum deposit vs one cent below.
  - Overdraft transaction when opt-in is disabled vs enabled.
  - Fee waiver trigger on exactly 500 dollars direct deposit vs 499.99 dollars.
obsolete_terms:
  $5 overdraft fee: The CFPB $5 overdraft benchmark rule (December 2024) was repealed under the Congressional Review Act in 2025. Do not treat it as in force; use the bank's configured fee.
