name: Personal Loans
id_prefixes: [LOAN]
context: >
  Unsecured fixed-rate term installment loans. Approval decisions evaluate credit score, minimum annual income,
  maximum debt-to-income (DTI) cap, and maximum loan amounts based on applicant credit tier.
glossary:
  origination fee: Upfront deduction from loan disbursement proceeds.
  amortization: Equal monthly payment schedule covering principal and interest.
risk_tags: [dti_cap, credit_tier, origination_deduction]
boundary_hints:
  - DTI exactly 43.0% vs 43.1%.
  - FICO score at credit tier threshold (e.g., 679 vs 680).
  - Loan term outside allowed durations (e.g., 12, 24, 36, 48, 60 months).
obsolete_terms:
  incurred loss: Replaced by the CECL model (ASC 326, current expected credit losses) for loan loss allowances.
