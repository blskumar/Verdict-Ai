name: Lending & Credit
description: Consumer and commercial loans, mortgages, underwriting criteria, and credit evaluation.
context: >
  Lending origination assesses applicant creditworthiness, income verification, debt-to-income ratios,
  collateral valuation, and statutory disclosures (Truth in Lending, Equal Credit Opportunity).
glossary:
  dti: Debt-To-Income ratio of monthly debt payments over gross monthly income.
  ltv: Loan-To-Value ratio comparing loan amount against appraised collateral value.
  fico: Credit bureau scoring metric utilized in automated decisioning.
risk_tags: [credit_risk, collateral, underwriting_referral]
id_prefixes: [LEND]
